name: Nightly Predictive Markets Pipeline

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Fetch, Match & Save Market Data
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4.2.2

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run pipeline
        timeout-minutes: 175
        run: python -u pipeline.py

      - name: 📤 Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: market-data-${{ github.run_number }}-${{ github.run_id }}
          path: data/
          retention-days: 90

      # ── 6. Commit only the small final output (kalshi_poly_df) to the repo ──
      #       poly_df and df_kalshi_filtered are too large for git (100 MB limit).
      #       They are available via the Artifact above.
      - name: 📝 Commit & push kalshi_poly_df to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kalshi_poly_df.parquet data/kalshi_poly_df.json || true
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "🤖 nightly data update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



        timeout-minutes: 175
        run: python -u pipeline.py

      - name: 📤 Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_number }}-${{ github.run_id }}
          path: data/
          retention-days: 90

      # ── 6. Commit only the small final output (kalshi_poly_df) to the repo ──
      #       poly_df and df_kalshi_filtered are too large for git (100 MB limit).
      #       They are available via the Artifact above.
      - name: 📝 Commit & push kalshi_poly_df to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kalshi_poly_df.parquet data/kalshi_poly_df.json || true
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "🤖 nightly data update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



